name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Frontend unit tests
        run: node --test tests/js/frontend.test.mjs
      - name: Install browser for UI / accessibility tests
        run: python -m playwright install --with-deps chromium
      - name: Tests (unit, API, browser + axe accessibility) with coverage gate
        run: python -m pytest -q --cov=smarthealth --cov-report=term-missing --cov-fail-under=90
      - name: Migrations apply cleanly and match the models
        env: { SMARTHEALTH_DB: "sqlite:///ci.db" }
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SMARTHEALTH_DB: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - name: Migrations on PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smarthealth:ci .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r requirements.txt
